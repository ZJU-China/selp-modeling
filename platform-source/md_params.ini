# MD 模拟参数配置文件
# 所有可调参数集中管理，修改后需同步更新对应脚本

# ============================================================
# 1. 文件路径（必需，按实际安装位置修改）
# ============================================================

[paths]
# CHARMM 力场文件
topology_file = /home/selp/igem-2026/CHARMM_toppar/top_all36_prot.rtf
parameter_file = /home/selp/igem-2026/CHARMM_toppar/par_all36m_prot.prm

# 输入结构文件
input_pdb = 2KY10.pdb
built_psf = 2KY10_built.psf
built_pdb = 2KY10_built.pdb
hmr_psf = 2KY10_hmr.psf
minimized_coor = gbis_test.coor
equilibrated_coor = hmr4fs_eq100ps.coor

# NAMD 可执行文件路径
namd_multicore = /home/selp/igem-2026/MD/NAMD_3.0.2_Linux-x86_64-multicore/namd3
namd_smp = /home/selp/igem-2026/MD/NAMD_3.0.2_Linux-x86_64-netlrts-smp/namd3
charmrun = /home/selp/igem-2026/MD/NAMD_3.0.2_Linux-x86_64-netlrts-smp/charmrun

# ============================================================
# 2. 结构构建参数（一般无需修改）
# ============================================================

[psfgen]
# 末端 patch
first_patch = GLYP
last_patch = CTER

# 残基/原子别名
alias_his = HSD
alias_ile_cd = CD

# ============================================================
# 3. HMR 参数
# ============================================================

[hmr]
# 氢质量重分配目标质量 (Da)
# 标准值: 3.024 (允许 4 fs 时间步长)
# 范围: 1.5-4.0, 越大越稳定但物理意义越弱
hydrogen_mass = 3.024

# ============================================================
# 4. 能量最小化参数
# ============================================================

[minimize]
# 最小化步数
# 推荐: 5000-20000, 体系越大需要越多步
steps = 10000

# 初始温度 (K)
temperature = 310

# 截断半径 (Å)
cutoff = 12.0
switchdist = 10.0
pairlistdist = 14.0

# 并行核心数
num_cores = 16

# ============================================================
# 5. GBIS 隐式溶剂参数
# ============================================================

[gbis]
# 溶剂介电常数
# 水: 78.5 (默认)
solvent_dielectric = 78.5

# 盐浓度 (mol/L)
# 生理盐浓度: 0.15
ion_concentration = 0.15

# SASA 截断 (Å)
alpha_cutoff = 14.0

# 表面张力 (kcal/mol/Å²)
# 默认: 0.005
surface_tension = 0.005

# ============================================================
# 6. 动力学模拟参数
# ============================================================

[dynamics]
# 时间步长 (fs)
# HMR 后: 4.0
# 无 HMR: 2.0
timestep = 4.0

# 约束
rigid_bonds = all
rigid_tolerance = 1.0e-8

# 非键更新频率
nonbonded_freq = 1
full_elect_freq = 1
steps_per_cycle = 20

# 截断半径 (Å)
# 注意: 比 minimize 的 cutoff 大
cutoff = 16.0
switchdist = 15.0
pairlistdist = 18.0

# ============================================================
# 7. 温控参数
# ============================================================

[thermostat]
# Langevin 阻尼系数 (1/ps)
# 越大热浴耦合越强, 推荐: 1.0-5.0
langevin_damping = 1.0

# 是否对氢原子应用 Langevin
langevin_hydrogen = off

# 目标温度 (K)
# 仅用于单副本模拟
target_temperature = 280

# ============================================================
# 8. TIGER2 增强采样参数
# ============================================================

[tiger2]
# Replica 数量
# 推荐: 4-8, 受限于 CPU 核心数
num_replicas = 4

# 温度范围 (K)
# min_temp: 目标温度 (baseline)
# max_temp: 高温上限, 越高越容易跨越能垒
min_temp = 280
max_temp = 400

# 每个 cycle 的三个阶段 (步数)
# equil1: 加热/平衡
# sample: 高温采样
# equil2: 淬火回 baseline
steps_equil1 = 500      # 2 ps
steps_sample = 12000    # 48 ps
steps_equil2 = 2500     # 10 ps

# 总 cycle 数
# 417 cycles × 60 ps = 25.02 ns per replica
num_runs = 417

# Restart 写入频率
# 每 frames_per_restart × runs_per_frame 个 cycle 写一次
runs_per_frame = 5
frames_per_restart = 5

# ============================================================
# 9. 输出参数
# ============================================================

[output]
# 输出名称前缀
minimize_name = minimize
hmr_test_name = hmr4fs_test
eq_name = hmr4fs_eq100ps
tiger2_prod_prefix = tiger2-prod
tiger2_test_prefix = tiger2-test

# 输出频率
output_energies = 500    # 能量输出间隔 (步)
dcd_freq = 0             # DCD 轨迹频率 (0 = 由 TIGER2 控制)
restart_freq = 0         # Restart 频率 (0 = 由 TIGER2 控制)

# 二进制输出
binary_output = yes
binary_restart = yes

# ============================================================
# 10. 并行参数
# ============================================================

[parallel]
# 单副本核心数
single_core_num = 16

# TIGER2 SMP 参数
# ++n: 总进程数 (= num_replicas)
# ++ppn: 每进程 worker 数
smp_n = 4
smp_ppn = 1

# ============================================================
# 11. 分析参数（Python 脚本）
# ============================================================

[analysis]
# 聚类参数
n_clusters = 5
clustering_method = kmeans  # kmeans

# 丢弃前期未平衡帧的比例
discard_fraction = 0.2

# RMSD 聚类阈值 (Å)
rmsd_threshold = 6.0

# ============================================================
# 派生参数（自动计算，无需手动修改）
# ============================================================

# 每 cycle 总步数 = equil1 + sample + equil2 = 15000
# 每 cycle 时间 = 15000 × 4 fs = 60 ps
# 每 replica 总时间 = num_runs × 60 ps
# 总 aggregate 时间 = per_replica × num_replicas
# Restart 间隔 = runs_per_frame × frames_per_restart × 15000 步
