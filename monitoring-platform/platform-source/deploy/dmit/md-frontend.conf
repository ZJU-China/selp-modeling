# ⚠ 目前不允许部署
# dmit 部署已停用：前端与后端均部署在 iGEM 服务器（127.0.0.1）上，
# 由 systemd 用户服务 md-frontend（vite :5173）与 md-server（API :3001）
# 托管。请勿再部署到 dmit。
# MD frontend (静态 SPA) + /api 反向代理到 iGEM 后端
#
# 部署位置：/etc/nginx/sites-available/md-frontend
# 网络前提：dmit 无法直连 127.0.0.1:3001（iGEM 防火墙），
#           后端经 iGEM 服务器上的反向隧道暴露在 dmit 的 127.0.0.1:3001
#           （见 backend-tunnel.service）。
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/md-frontend;
    index index.html;

    # 静态资源带 hash 文件名，可长缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 所有 /api/* 走后端（保留完整路径，后端挂载点就是 /api）
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # DCD / MP4 / GIF 二进制流经此代理，关闭缓冲 + 放宽超时
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
