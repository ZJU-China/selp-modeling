worker_processes 1;
pid run/nginx.pid;
error_log logs/error.log warn;
events { worker_connections 256; }
http {
    proxy_temp_path /home/selp/websites/selp-modeling/run/proxy_temp;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log logs/access.log combined;
    sendfile on;
    server_tokens off;
    keepalive_timeout 15;
    gzip on;
    gzip_types application/json text/css application/javascript text/plain;
    server {
        listen 127.0.0.1:8765;
        server_name 127.0.0.1;
        root /home/selp/websites/selp-modeling/current;
        index index.html;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        location = /flows {
            try_files /flows.html =404;
        }
        location ^~ /flows/app/ {
            alias /home/selp/websites/selp-modeling/flows-app/;
            try_files $uri $uri/ /flows/app/index.html;
        }
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            add_header Cache-Control "no-store" always;
        }
        location ^~ /platform/ {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:3001/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "no-store" always;
        }
        location /charts/ {
            proxy_pass http://127.0.0.1:8766;
            proxy_http_version 1.1;
            add_header Cache-Control "no-store" always;
        }
        location / { try_files $uri $uri/ =404; }
        location ~ /\. { deny all; }
    }
}
