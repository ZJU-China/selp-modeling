structure          2KY5_snoopytag_hmr.psf
coordinates        2KY5_snoopytag_hmr.pdb
binCoordinates     equil/01_minimize_vacuum.coor

paraTypeCharmm     on
parameters         toppar/par_all36m_prot.prm

set output_root    equil/02_minimize_gbis
outputName         $output_root
binaryOutput       yes
restartFreq        1000
outputEnergies     100
outputTiming       1000
DCDfile            ${output_root}.dcd
DCDfreq            500

exclude            scaled1-4
oneFourScaling     1.0
switching          on
switchdist         15.0
cutoff             16.0
pairlistdist       18.0
stepspercycle      20
margin             10.0
nonbondedFreq      1
fullElectFrequency 1
PME                off
wrapAll            off

GBIS               on
alphaCutoff        15.0
ionConcentration   0.15
dielectric         1.0
solventDielectric  78.5
SASA               on
surfaceTension     0.005

temperature        50
minimize           20000
