structure          2KY5_snoopytag_hmr.psf
coordinates        2KY5_snoopytag_hmr.pdb
binCoordinates     equil/02_minimize_gbis.coor

paraTypeCharmm     on
parameters         toppar/par_all36m_prot.prm

set output_root    equil/03_gbis_warm_025fs
outputName         $output_root
binaryOutput       yes
restartFreq        20000
outputEnergies     200
outputTiming       5000
DCDfile            ${output_root}.dcd
DCDfreq            2000

exclude            scaled1-4
oneFourScaling     1.0
switching          on
switchdist         15.0
cutoff             16.0
pairlistdist       18.0
stepspercycle      20
margin             10.0
nonbondedFreq      1
fullElectFrequency 1
PME                off
wrapAll            off

GBIS               on
alphaCutoff        15.0
ionConcentration   0.15
dielectric         1.0
solventDielectric  78.5
SASA               on
surfaceTension     0.005

timestep           0.25
rigidBonds         none
temperature        50
langevin           on
langevinTemp       280
langevinDamping    20.0
langevinHydrogen   on
GPUresident        off

# 50 ps.
run                200000
