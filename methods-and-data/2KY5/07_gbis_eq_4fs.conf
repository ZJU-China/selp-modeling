structure          2KY5_snoopytag_hmr.psf
coordinates        2KY5_snoopytag_hmr.pdb
binCoordinates     equil/06_gbis_eq_2fs.coor
binVelocities      equil/06_gbis_eq_2fs.vel

paraTypeCharmm     on
parameters         toppar/par_all36m_prot.prm
set output_root    equil/07_gbis_eq_4fs
outputName         $output_root
binaryOutput       yes
restartFreq        5000
outputEnergies     100
outputTiming       1000
DCDfile            ${output_root}.dcd
DCDfreq            500
exclude            scaled1-4
oneFourScaling     1.0
switching          on
switchdist         15.0
cutoff             16.0
pairlistdist       18.0
stepspercycle      20
margin             10.0
nonbondedFreq      1
fullElectFrequency 1
PME                off
wrapAll            off
GBIS               on
alphaCutoff        15.0
ionConcentration   0.15
dielectric         1.0
solventDielectric  78.5
SASA               on
surfaceTension     0.005
timestep           4.0
rigidBonds         all
rigidTolerance     1.0e-6
rigidIterations    1000
rigidDieOnError    on
langevin           on
langevinTemp       280
langevinDamping    2.0
langevinHydrogen   off
GPUresident        off

# 100 ps production-timestep validation.
run                25000
